[project]
name = "racingrl"
version = "0.1.0"
description = ""
authors = [
    {name = "Subeen Regmi",email = "subeenregmi123@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy (>=2.3.5,<3.0.0)",
    "torch (>=2.9.1,<3.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "gymnasium[box2d] (>=1.2.2,<2.0.0)",
